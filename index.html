<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Blog Preview Card | Frontend Mentor</title>

    <!-- Styles -->
    <!-- Base -->
    <link rel="stylesheet" href="./assets/styles/base/variables.css" />
    <link rel="stylesheet" href="./assets/styles/base/reset.css" />
    <!-- Layout -->
    <link rel="stylesheet" href="./assets/styles/layout/page-layout.css">
    <!-- Components -->
    <link rel="stylesheet" href="./assets/styles/components/blog-card.css">
</head>

<body>
    <main>
        <article class="blog-card">
            <img class="blog-card__logo" src="./assets/images/illustration-article.svg" width="279" height="200"
                alt="Blog Illustration">
            <header class="blog-card__content">
                <p class="blog-card__category">Learning</p>
                <p class="blog-card__publish-date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
                <h3 class="blog-card__title">HTML & CSS foundations</h3>
                <p class="blog-card__description">
                    These languages are the backbone of every website, defining structure, content, and presentation.
                </p>
            </header>
            <footer class="blog-card__author">
                <img class="blog-card__author-avatar" src="./assets/images/image-avatar.webp" width="32" height="32"
                    alt="Blog Author">
                <p class="blog-card__author-name">Greg Hooper</p>
            </footer>
        </article>
    </main>
</body>

</html>
